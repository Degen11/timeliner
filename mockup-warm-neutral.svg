<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" font-family="'Inter', system-ui, sans-serif">
  <defs>
    <style>
      text { font-family: 'Inter', system-ui, sans-serif; }
    </style>
  </defs>

  <!-- Canvas background - warm off-white -->
  <rect width="800" height="500" fill="#FAFAF9" rx="12"/>

  <!-- Sidebar - warm dark stone -->
  <rect width="200" height="500" fill="#292524" rx="12 0 0 12"/>
  <rect x="180" width="20" height="500" fill="#292524"/>

  <!-- Sidebar content -->
  <text x="24" y="36" fill="#D6D3D1" font-size="11" font-weight="600" letter-spacing="0.05em">TIMELINER</text>
  <rect x="16" y="52" width="168" height="32" rx="6" fill="#3C3835"/>
  <text x="28" y="72" fill="#A8A29E" font-size="12">Search timelines...</text>

  <!-- Sidebar timeline items -->
  <rect x="12" y="96" width="176" height="36" rx="6" fill="#44403C"/>
  <circle cx="28" cy="114" r="4" fill="#C2956B"/>
  <text x="40" y="118" fill="#F5F5F4" font-size="12" font-weight="500">My Biography</text>

  <rect x="12" y="138" width="176" height="36" rx="6" fill="transparent"/>
  <circle cx="28" cy="156" r="4" fill="#78716C"/>
  <text x="40" y="160" fill="#A8A29E" font-size="12">World War II</text>

  <rect x="12" y="180" width="176" height="36" rx="6" fill="transparent"/>
  <circle cx="28" cy="198" r="4" fill="#78716C"/>
  <text x="40" y="202" fill="#A8A29E" font-size="12">Family History</text>

  <!-- Sidebar bottom - new timeline button -->
  <rect x="12" y="456" width="176" height="32" rx="6" fill="transparent" stroke="#57534E" stroke-width="1" stroke-dasharray="4 2"/>
  <text x="100" y="476" fill="#78716C" font-size="12" text-anchor="middle">+ New Timeline</text>

  <!-- Header bar -->
  <rect x="200" y="0" width="600" height="52" fill="#FAFAF9"/>
  <line x1="200" y1="52" x2="800" y2="52" stroke="#E7E5E4" stroke-width="1"/>

  <!-- Header content -->
  <text x="224" y="32" fill="#1C1917" font-size="16" font-weight="600" font-family="'Source Serif 4', Georgia, serif">My Biography</text>

  <!-- Toolbar -->
  <rect x="200" y="52" width="600" height="40" fill="#F5F5F4"/>
  <line x1="200" y1="92" x2="800" y2="92" stroke="#E7E5E4" stroke-width="1"/>

  <!-- View tabs -->
  <rect x="216" y="58" width="64" height="28" rx="6" fill="#C2956B"/>
  <text x="248" y="76" fill="#FFFFFF" font-size="11" font-weight="500" text-anchor="middle">Vertical</text>

  <text x="308" y="76" fill="#78716C" font-size="11">Grid</text>
  <text x="356" y="76" fill="#78716C" font-size="11">Map</text>
  <text x="400" y="76" fill="#78716C" font-size="11">Graph</text>

  <!-- Sort/filter on right -->
  <text x="700" y="76" fill="#78716C" font-size="11">Sort: Date</text>

  <!-- Timeline vertical line -->
  <line x1="280" y1="110" x2="280" y2="480" stroke="#D6D3D1" stroke-width="2"/>

  <!-- Event 1 - Career tag (warm sapphire) -->
  <circle cx="280" cy="140" r="6" fill="#C2956B" stroke="#FAFAF9" stroke-width="2"/>
  <rect x="304" y="114" width="460" height="68" rx="8" fill="#FFFFFF" stroke="#E7E5E4" stroke-width="1"/>
  <text x="320" y="136" fill="#1C1917" font-size="13" font-weight="600">Started at Acme Corp</text>
  <text x="320" y="153" fill="#57534E" font-size="11">Joined as a software engineer in the San Francisco office.</text>
  <text x="320" y="170" fill="#A8A29E" font-size="10">March 2019</text>
  <!-- Tag badge - Career -->
  <rect x="420" y="160" width="52" height="20" rx="10" fill="#DBEAFE"/>
  <text x="446" y="174" fill="#1E3A5F" font-size="10" text-anchor="middle">Career</text>

  <!-- Event 2 - Travel tag (emerald) -->
  <circle cx="280" cy="222" r="6" fill="#059669" stroke="#FAFAF9" stroke-width="2"/>
  <rect x="304" y="196" width="460" height="68" rx="8" fill="#FFFFFF" stroke="#E7E5E4" stroke-width="1"/>
  <text x="320" y="218" fill="#1C1917" font-size="13" font-weight="600">Backpacking through Japan</text>
  <text x="320" y="235" fill="#57534E" font-size="11">Three weeks exploring Tokyo, Kyoto, and the countryside.</text>
  <text x="320" y="252" fill="#A8A29E" font-size="10">October 2020</text>
  <!-- Tag badge - Travel -->
  <rect x="436" y="242" width="48" height="20" rx="10" fill="#D1FAE5"/>
  <text x="460" y="256" fill="#064E3B" font-size="10" text-anchor="middle">Travel</text>

  <!-- Event 3 - Family tag (rose) -->
  <circle cx="280" cy="304" r="6" fill="#E11D48" stroke="#FAFAF9" stroke-width="2"/>
  <rect x="304" y="278" width="460" height="68" rx="8" fill="#FFFFFF" stroke="#E7E5E4" stroke-width="1"/>
  <text x="320" y="300" fill="#1C1917" font-size="13" font-weight="600">Wedding Day</text>
  <text x="320" y="317" fill="#57534E" font-size="11">Married Sarah at the botanical gardens. Perfect weather.</text>
  <text x="320" y="334" fill="#A8A29E" font-size="10">June 2021</text>
  <!-- Tag badge - Family -->
  <rect x="420" y="324" width="50" height="20" rx="10" fill="#FFE4E6"/>
  <text x="445" y="338" fill="#881337" font-size="10" text-anchor="middle">Family</text>

  <!-- Event 4 - Education tag (violet) -->
  <circle cx="280" cy="386" r="6" fill="#7C3AED" stroke="#FAFAF9" stroke-width="2"/>
  <rect x="304" y="360" width="460" height="68" rx="8" fill="#FFFFFF" stroke="#E7E5E4" stroke-width="1"/>
  <text x="320" y="382" fill="#1C1917" font-size="13" font-weight="600">MBA Program Completed</text>
  <text x="320" y="399" fill="#57534E" font-size="11">Graduated with honors from Stanford GSB evening program.</text>
  <text x="320" y="416" fill="#A8A29E" font-size="10">May 2023</text>
  <!-- Tag badge - Education -->
  <rect x="436" y="406" width="66" height="20" rx="10" fill="#EDE9FE"/>
  <text x="469" y="420" fill="#4C1D95" font-size="10" text-anchor="middle">Education</text>

  <!-- Accent label -->
  <rect x="620" y="460" width="160" height="28" rx="14" fill="#C2956B"/>
  <text x="700" y="478" fill="#FFFFFF" font-size="11" font-weight="500" text-anchor="middle">Warm Neutral Theme</text>
</svg>