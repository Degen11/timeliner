<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" font-family="'Space Grotesk', system-ui, sans-serif">
  <defs>
    <style>
      text { font-family: system-ui, -apple-system, sans-serif; }
    </style>
  </defs>

  <!-- Canvas background - warm white / cream paper -->
  <rect width="800" height="500" fill="#FAF9F7" rx="12"/>

  <!-- Sidebar - deep ink black -->
  <rect width="200" height="500" fill="#0F0F0F" rx="12 0 0 12"/>
  <rect x="180" width="20" height="500" fill="#0F0F0F"/>

  <!-- Sidebar content -->
  <text x="24" y="36" fill="#A3A3A3" font-size="11" font-weight="600" letter-spacing="0.08em">TIMELINER</text>
  <rect x="16" y="52" width="168" height="32" rx="6" fill="#1A1A1A"/>
  <text x="28" y="72" fill="#737373" font-size="12">Search timelines...</text>

  <!-- Sidebar timeline items -->
  <rect x="12" y="96" width="176" height="36" rx="6" fill="#1A1A1A"/>
  <rect x="22" y="109" width="3" height="14" rx="1.5" fill="#F97355"/>
  <text x="34" y="118" fill="#FAFAFA" font-size="12" font-weight="500">My Biography</text>

  <rect x="12" y="138" width="176" height="36" rx="6" fill="transparent"/>
  <rect x="22" y="151" width="3" height="14" rx="1.5" fill="#404040"/>
  <text x="34" y="160" fill="#737373" font-size="12">World War II</text>

  <rect x="12" y="180" width="176" height="36" rx="6" fill="transparent"/>
  <rect x="22" y="193" width="3" height="14" rx="1.5" fill="#404040"/>
  <text x="34" y="202" fill="#737373" font-size="12">Family History</text>

  <!-- Sidebar bottom -->
  <rect x="12" y="456" width="176" height="32" rx="6" fill="transparent" stroke="#333333" stroke-width="1" stroke-dasharray="4 2"/>
  <text x="100" y="476" fill="#525252" font-size="12" text-anchor="middle">+ New Timeline</text>

  <!-- Header bar -->
  <rect x="200" y="0" width="600" height="52" fill="#FAF9F7"/>
  <line x1="200" y1="52" x2="800" y2="52" stroke="#E5E5E5" stroke-width="1"/>

  <!-- Header content - bold serif heading -->
  <text x="224" y="34" fill="#0A0A0A" font-size="18" font-weight="700" font-family="'Space Grotesk', sans-serif">My Biography</text>

  <!-- Toolbar - barely visible background -->
  <rect x="200" y="52" width="600" height="40" fill="#F5F5F3"/>
  <line x1="200" y1="92" x2="800" y2="92" stroke="#E5E5E5" stroke-width="1"/>

  <!-- View tabs - coral accent for active -->
  <rect x="216" y="58" width="64" height="28" rx="6" fill="#0F0F0F"/>
  <text x="248" y="76" fill="#FFFFFF" font-size="11" font-weight="500" text-anchor="middle">Vertical</text>

  <text x="308" y="76" fill="#737373" font-size="11">Grid</text>
  <text x="356" y="76" fill="#737373" font-size="11">Map</text>
  <text x="400" y="76" fill="#737373" font-size="11">Graph</text>

  <!-- Sort on right -->
  <text x="700" y="76" fill="#737373" font-size="11">Sort: Date</text>

  <!-- Timeline vertical line - fine ink line -->
  <line x1="280" y1="110" x2="280" y2="480" stroke="#D4D4D4" stroke-width="1.5"/>

  <!-- Event 1 - Career tag -->
  <circle cx="280" cy="140" r="5" fill="#0F0F0F" stroke="#FAF9F7" stroke-width="2"/>
  <rect x="304" y="114" width="460" height="68" rx="8" fill="#FFFFFF" stroke="#E5E5E5" stroke-width="1"/>
  <!-- Coral left accent bar -->
  <rect x="304" y="114" width="3" height="68" rx="1.5 0 0 1.5" fill="#F97355"/>
  <text x="320" y="136" fill="#0A0A0A" font-size="13" font-weight="600">Started at Acme Corp</text>
  <text x="320" y="153" fill="#525252" font-size="11">Joined as a software engineer in the San Francisco office.</text>
  <text x="320" y="170" fill="#A3A3A3" font-size="10">March 2019</text>
  <!-- Tag badge - minimal outlined style -->
  <rect x="420" y="160" width="52" height="20" rx="10" fill="#DBEAFE"/>
  <text x="446" y="174" fill="#1E3A5F" font-size="10" text-anchor="middle">Career</text>

  <!-- Event 2 - Travel tag -->
  <circle cx="280" cy="222" r="5" fill="#0F0F0F" stroke="#FAF9F7" stroke-width="2"/>
  <rect x="304" y="196" width="460" height="68" rx="8" fill="#FFFFFF" stroke="#E5E5E5" stroke-width="1"/>
  <rect x="304" y="196" width="3" height="68" rx="1.5 0 0 1.5" fill="#F97355"/>
  <text x="320" y="218" fill="#0A0A0A" font-size="13" font-weight="600">Backpacking through Japan</text>
  <text x="320" y="235" fill="#525252" font-size="11">Three weeks exploring Tokyo, Kyoto, and the countryside.</text>
  <text x="320" y="252" fill="#A3A3A3" font-size="10">October 2020</text>
  <rect x="436" y="242" width="48" height="20" rx="10" fill="#D1FAE5"/>
  <text x="460" y="256" fill="#064E3B" font-size="10" text-anchor="middle">Travel</text>

  <!-- Event 3 - Family tag -->
  <circle cx="280" cy="304" r="5" fill="#0F0F0F" stroke="#FAF9F7" stroke-width="2"/>
  <rect x="304" y="278" width="460" height="68" rx="8" fill="#FFFFFF" stroke="#E5E5E5" stroke-width="1"/>
  <rect x="304" y="278" width="3" height="68" rx="1.5 0 0 1.5" fill="#F97355"/>
  <text x="320" y="300" fill="#0A0A0A" font-size="13" font-weight="600">Wedding Day</text>
  <text x="320" y="317" fill="#525252" font-size="11">Married Sarah at the botanical gardens. Perfect weather.</text>
  <text x="320" y="334" fill="#A3A3A3" font-size="10">June 2021</text>
  <rect x="420" y="324" width="50" height="20" rx="10" fill="#FFE4E6"/>
  <text x="445" y="338" fill="#881337" font-size="10" text-anchor="middle">Family</text>

  <!-- Event 4 - Education tag -->
  <circle cx="280" cy="386" r="5" fill="#0F0F0F" stroke="#FAF9F7" stroke-width="2"/>
  <rect x="304" y="360" width="460" height="68" rx="8" fill="#FFFFFF" stroke="#E5E5E5" stroke-width="1"/>
  <rect x="304" y="360" width="3" height="68" rx="1.5 0 0 1.5" fill="#F97355"/>
  <text x="320" y="382" fill="#0A0A0A" font-size="13" font-weight="600">MBA Program Completed</text>
  <text x="320" y="399" fill="#525252" font-size="11">Graduated with honors from Stanford GSB evening program.</text>
  <text x="320" y="416" fill="#A3A3A3" font-size="10">May 2023</text>
  <rect x="436" y="406" width="66" height="20" rx="10" fill="#EDE9FE"/>
  <text x="469" y="420" fill="#4C1D95" font-size="10" text-anchor="middle">Education</text>

  <!-- Accent label -->
  <rect x="620" y="460" width="160" height="28" rx="14" fill="#0F0F0F"/>
  <text x="700" y="478" fill="#FFFFFF" font-size="11" font-weight="500" text-anchor="middle">Ink &amp; Paper Theme</text>
</svg>